name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the built-in GITHUB_TOKEN:
# read the code, and write packages so the image can be pushed to GHCR
permissions:
  contents: read
  packages: write

env:
  # ghcr.io/<owner>/<repo> (GHCR requires a lowercase name)
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Download the repository code onto the runner
      - name: Checkout
        uses: actions/checkout@v7

      # Install Node.js 20 and cache npm downloads between runs
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Install exact dependency versions from package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Run the Jest tests; the pipeline stops here if any test fails
      - name: Run tests
        working-directory: app
        run: npm test

      # Build the image, tagged with the commit SHA so every build is traceable
      - name: Build Docker image
        run: docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest ./app

      # Scan the image for known vulnerabilities; fail on fixable HIGH/CRITICAL ones.
      # Pinned to a commit SHA instead of a tag so the action can't change underneath us.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Log in to GitHub Container Registry (only on push to main, never on PRs)
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push both tags to GHCR (only on push to main)
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
